<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pinyin & English Reader Studio</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
      --accent-dim: rgba(56, 189, 248, 0.15);
      --success: #22c55e;
      --danger: #f43f5e;
      /* Toni Pleco */
      --tone-1: #f87171;
      --tone-2: #4ade80;
      --tone-3: #60a5fa;
      --tone-4: #c084fc;
      --tone-5: #94a3b8;
    }
    body {
      margin: 0;
      padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px) 16px;
      background: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
    
    .header-actions { display: flex; gap: 6px; }

    /* Controlli e Barra Strumenti */
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .toolbar-group { display: flex; gap: 5px; align-items: center; }

    .btn {
      background: #0f172a;
      color: var(--text-dim);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }
    .btn-done {
      background: var(--success);
      color: #052e16;
      border: none;
      font-weight: 700;
    }
    .btn-main {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .btn-main:disabled { opacity: 0.5; }

    /* Area Testo */
    textarea {
      width: 100%;
      height: 80px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 10px;
      padding: 12px;
      box-sizing: border-box;
      font-size: 0.95rem;
      resize: vertical;
      margin-bottom: 10px;
    }

    /* Telemetry */
    .telemetry-bar {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      margin-bottom: 14px;
      font-size: 0.78rem;
      color: var(--text-dim);
      justify-content: space-between;
      align-items: center;
    }
    .telemetry-bar.active { display: flex; }
    .badge {
      background: var(--accent-dim);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    /* Carte e Segmentazione */
    .cards { display: flex; flex-direction: column; gap: 14px; }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid var(--border);
    }
    .card.speaking-card {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-dim);
    }

    .sentence-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      align-items: flex-end;
      line-height: 2.3;
    }
    .word-token {
      display: inline-flex;
      cursor: pointer;
      border-radius: 6px;
      padding: 0 3px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 2px solid transparent;
      user-select: none;
    }
    .word-token:active {
      background: var(--accent-dim);
      border-bottom-color: var(--accent);
    }
    ruby {
      font-size: 1.6rem;
      color: var(--text-main);
      ruby-position: over;
      padding: 0 1px;
    }
    rt {
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      transition: opacity 0.2s;
    }
    /* Classe per nascondere il Pinyin via switch */
    body.hide-pinyin rt {
      display: none !important;
    }

    .punctuation {
      font-size: 1.6rem;
      color: var(--text-dim);
      align-self: flex-end;
      line-height: 1.8;
    }

    /* Stile per testo in inglese */
    .english-word {
      font-size: 1.15rem;
      color: #38bdf8;
      font-weight: 500;
      padding: 2px 4px;
      cursor: pointer;
    }

    /* Toni Pinyin */
    .t1 { color: var(--tone-1) !important; }
    .t2 { color: var(--tone-2) !important; }
    .t3 { color: var(--tone-3) !important; }
    .t4 { color: var(--tone-4) !important; }
    .t5 { color: var(--tone-5) !important; }

    .translation {
      font-size: 0.95rem;
      color: #cbd5e1;
      border-top: 1px solid #334155;
      padding-top: 8px;
      line-height: 1.4;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Modal Impostazioni */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      max-width: 450px;
    }
    .modal-card label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 12px;
      margin-bottom: 4px;
    }
    .modal-card input, .modal-card select {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Pinyin & Audio Studio</h1>
    <div class="header-actions">
      <button class="btn" onclick="openKeyModal()">⚙️ Imposta</button>
      <button class="btn btn-done" onclick="exitWithFullReset()" title="Svuota la sessione e chiudi l'app">✓ Esci</button>
    </div>
  </header>

  <textarea id="raw-text" placeholder="Incolla o digita testo in Cinese o Inglese..."></textarea>

  <div class="controls-row">
    <div class="toolbar-group">
      <!-- Selettore velocità -->
      <button class="btn" onclick="setSpeed(0.5, this)">0.5x</button>
      <button class="btn active" onclick="setSpeed(0.75, this)">0.75x</button>
      <button class="btn" onclick="setSpeed(1.0, this)">1.0x</button>
      
      <!-- Switch Mostra / Nascondi Pinyin -->
      <button id="pinyin-toggle" class="btn" onclick="togglePinyinVisibility()">拼 ON</button>
    </div>

    <div class="toolbar-group">
      <!-- Player Globale: Ascolta Tutto / Pausa / Stop -->
      <button id="global-play-btn" class="btn" onclick="handleGlobalSpeech()">▶ Tutto</button>
      <button id="global-stop-btn" class="btn" onclick="stopAllSpeech()" style="display:none;">⏹</button>
      
      <button id="process-btn" class="btn-main" onclick="processText()">Elabora AI</button>
    </div>
  </div>

  <div id="telemetry-box" class="telemetry-bar">
    <span id="telemetry-summary">Pronto</span>
  </div>

  <div id="content" class="cards">
    <div id="status-msg" style="text-align: center; color: var(--text-dim); margin-top: 30px;">
      Nessun contenuto. Inserisci un testo in cinese o inglese e tocca "Elabora AI".
    </div>
  </div>

  <!-- Modal Impostazioni -->
  <div id="key-modal" class="modal-overlay">
    <div class="modal-card">
      <h3 style="margin-top: 0; font-size: 1.1rem;">Impostazioni OpenRouter</h3>
      <label for="api-key-input">Chiave API (sk-or-v1-...):</label>
      <input type="password" id="api-key-input" placeholder="sk-or-v1-..." autocomplete="off">

      <label for="model-preset">Modello Selezionato:</label>
      <select id="model-preset" onchange="handleModelPresetChange(this.value)">
        <option value="google/gemini-2.5-flash">Google Gemini 2.5 Flash (Super rapido & Economico)</option>
        <option value="anthropic/claude-3.5-haiku">Claude 3.5 Haiku (Accuratezza massima)</option>
        <option value="openai/gpt-4o-mini">GPT-4o Mini (Veloce e bilanciato)</option>
        <option value="deepseek/deepseek-chat">DeepSeek V3 (Ideale per il Cinese)</option>
        <option value="custom">Altro modello personalizzato...</option>
      </select>

      <div id="custom-model-wrapper" style="display: none;">
        <label for="custom-model-input">Identificativo Modello:</label>
        <input type="text" id="custom-model-input" placeholder="es. qwen/qwen-2.5-72b-instruct">
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px;">
        <button class="btn" onclick="closeKeyModal()">Annulla</button>
        <button class="btn-main" onclick="saveSettings()">Salva</button>
      </div>
    </div>
  </div>

  <script>
    let currentPlaybackRate = 0.75;
    const DEFAULT_MODEL = "google/gemini-2.5-flash";
    let isPinyinVisible = true;
    let loadedData = [];
    let detectedLang = 'zh-CN';

    // Stato Lettore Vocale
    let globalIndex = 0;
    let isGlobalPlaying = false;
    let isPaused = false;
    let currentParagraphIndex = null;

    // --- Persistenza Protetta iOS ---
    function safeStorageGet(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function safeStorageSet(key, value) {
      try { localStorage.setItem(key, value); } catch (e) {}
    }
    function safeStorageRemove(key) {
      try { localStorage.removeItem(key); } catch (e) {}
    }

    // Se l'utente tocca la SPUNTA ✓ Esci: azzera tutto e chiude
    function exitWithFullReset() {
      stopAllSpeech();
      safeStorageRemove('pinyin_cached_input');
      safeStorageRemove('pinyin_cached_output');
      safeStorageRemove('pinyin_cached_telemetry');
      document.getElementById('raw-text').value = '';
      document.getElementById('content').innerHTML = '';
      
      // Chiusura pagina/scheda in Comandi Rapidi o Safari
      window.close();
      setTimeout(() => {
        document.body.innerHTML = '<div style="text-align:center;margin-top:40px;color:#94a3b8;">Sessione terminata e memoria svuotata.<br>Puoi chiudere questa scheda.</div>';
      }, 300);
    }

    // Ripristino dati (se NON si è premuto Esci)
    window.addEventListener("load", () => {
      const savedInput = safeStorageGet('pinyin_cached_input');
      if (savedInput) document.getElementById('raw-text').value = savedInput;

      const savedOutput = safeStorageGet('pinyin_cached_output');
      if (savedOutput) {
        try {
          loadedData = JSON.parse(savedOutput);
          renderCards(loadedData);
        } catch(e) {}
      }
    });

    // --- Switch Visibilità Pinyin ---
    function togglePinyinVisibility() {
      isPinyinVisible = !isPinyinVisible;
      const btn = document.getElementById('pinyin-toggle');
      if (isPinyinVisible) {
        document.body.classList.remove('hide-pinyin');
        btn.innerText = "拼 ON";
        btn.classList.add('active');
      } else {
        document.body.classList.add('hide-pinyin');
        btn.innerText = "拼 OFF";
        btn.classList.remove('active');
      }
    }

    // --- Sintesi Vocale: Singolo & Globale con Play/Pausa ---
    function setSpeed(rate, el) {
      currentPlaybackRate = rate;
      document.querySelectorAll('.toolbar-group .btn').forEach(b => {
        if (b.innerText.includes('x')) b.classList.remove('active');
      });
      el.classList.add('active');
    }

    function getToneClass(pinyin) {
      if (!pinyin) return 't5';
      if (/[āēīōūǖ]/.test(pinyin)) return 't1';
      if (/[áéíóúǘ]/.test(pinyin)) return 't2';
      if (/[ǎěǐǒǔǚ]/.test(pinyin)) return 't3';
      if (/[àèìòùǜ]/.test(pinyin)) return 't4';
      return 't5';
    }

    function speakWord(text, lang) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = lang || detectedLang;
      utt.rate = currentPlaybackRate;
      window.speechSynthesis.speak(utt);
    }

    function toggleParagraphSpeech(index) {
      const btn = document.getElementById(`play-btn-${index}`);
      
      if (window.speechSynthesis.speaking && currentParagraphIndex === index) {
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
          btn.innerText = "⏸ Pausa";
        } else {
          window.speechSynthesis.pause();
          btn.innerText = "▶ Riprendi";
        }
        return;
      }

      stopAllSpeech();
      currentParagraphIndex = index;
      btn.innerText = "⏸ Pausa";

      const item = loadedData[index];
      const textToRead = item.s || item.words.map(w => w.h).join('');
      const utt = new SpeechSynthesisUtterance(textToRead);
      utt.lang = item.lang || detectedLang;
      utt.rate = currentPlaybackRate;

      utt.onend = () => {
        btn.innerText = "▶ Ascolta";
        currentParagraphIndex = null;
      };
      utt.onerror = () => {
        btn.innerText = "▶ Ascolta";
        currentParagraphIndex = null;
      };

      window.speechSynthesis.speak(utt);
    }

    function handleGlobalSpeech() {
      const gBtn = document.getElementById('global-play-btn');
      const sBtn = document.getElementById('global-stop-btn');

      if (!loadedData.length) return;

      if (window.speechSynthesis.speaking && isGlobalPlaying) {
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
          gBtn.innerText = "⏸ Pausa";
        } else {
          window.speechSynthesis.pause();
          gBtn.innerText = "▶ Riprendi";
        }
        return;
      }

      stopAllSpeech();
      isGlobalPlaying = true;
      globalIndex = 0;
      gBtn.innerText = "⏸ Pausa";
      sBtn.style.display = "inline-block";
      playNextInSequence();
    }

    function playNextInSequence() {
      if (!isGlobalPlaying || globalIndex >= loadedData.length) {
        stopAllSpeech();
        return;
      }

      document.querySelectorAll('.card').forEach(c => c.classList.remove('speaking-card'));
      const activeCard = document.getElementById(`card-${globalIndex}`);
      if (activeCard) {
        activeCard.classList.add('speaking-card');
        activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      const item = loadedData[globalIndex];
      const textToRead = item.s || item.words.map(w => w.h).join('');
      const utt = new SpeechSynthesisUtterance(textToRead);
      utt.lang = item.lang || detectedLang;
      utt.rate = currentPlaybackRate;

      utt.onend = () => {
        globalIndex++;
        playNextInSequence();
      };
      utt.onerror = () => stopAllSpeech();

      window.speechSynthesis.speak(utt);
    }

    function stopAllSpeech() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      isGlobalPlaying = false;
      currentParagraphIndex = null;
      document.getElementById('global-play-btn').innerText = "▶ Tutto";
      document.getElementById('global-stop-btn').style.display = "none";
      document.querySelectorAll('.card').forEach(c => c.classList.remove('speaking-card'));
      document.querySelectorAll('[id^="play-btn-"]').forEach(btn => btn.innerText = "▶ Ascolta");
    }

    // --- Elaborazione AI (Cinese + Inglese) ---
    async function processText() {
      const text = document.getElementById('raw-text').value.trim();
      if (!text) return;

      const apiKey = safeStorageGet('openrouter_api_key');
      if (!apiKey) {
        openKeyModal();
        return;
      }

      stopAllSpeech();
      safeStorageSet('pinyin_cached_input', text);

      const model = safeStorageGet('openrouter_model') || DEFAULT_MODEL;
      const btn = document.getElementById('process-btn');
      btn.disabled = true;
      btn.innerText = "Attendi...";

      const prompt = `Analizza questo testo preservando la suddivisione per FRASI/PARAGRAFI INTERI.
Il testo può essere in CINESE o in INGLESE.
Regole di output:
1. Identifica la lingua ("lang": "zh-CN" oppure "en-US").
2. Restituisci ESCLUSIVAMENTE un JSON strutturato così:
[
  {
    "s": "Frase originale completa",
    "m": "Traduzione integrale in italiano",
    "lang": "zh-CN o en-US",
    "words": [
      {
        "h": "Parola originale",
        "p": "Pinyin con accenti tonali separati da spazio (se cinese). Se inglese lascia stringa vuota \"\""
      }
    ]
  }
]
Testo da elaborare:
${text}`;

      const startTime = performance.now();

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json",
            "HTTP-Referer": window.location.href,
            "X-Title": "Pinyin & English Studio"
          },
          body: JSON.stringify({
            model: model,
            messages: [{ role: "user", content: prompt }],
            temperature: 0.1
          })
        });

        const duration = performance.now() - startTime;
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        let rawContent = data.choices[0].message.content.trim();
        
        const start = rawContent.indexOf('[');
        const end = rawContent.lastIndexOf(']');
        if (start !== -1 && end !== -1) {
          rawContent = rawContent.substring(start, end + 1);
        }

        loadedData = JSON.parse(rawContent);
        safeStorageSet('pinyin_cached_output', JSON.stringify(loadedData));
        renderCards(loadedData);

        const tBox = document.getElementById('telemetry-box');
        tBox.classList.add('active');
        document.getElementById('telemetry-summary').innerHTML = 
          `Modello: <span class="badge">${model}</span> | Tempo: <span class="badge">${(duration / 1000).toFixed(2)}s</span>`;
      } catch (err) {
        alert("Errore: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Elabora AI";
      }
    }

    function renderCards(data) {
      const container = document.getElementById('content');
      container.innerHTML = '';

      data.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${idx}`;

        const sentenceDiv = document.createElement('div');
        sentenceDiv.className = 'sentence-container';
        detectedLang = item.lang || (/[一-鿿]/.test(item.s) ? 'zh-CN' : 'en-US');

        const words = item.words || [];
        words.forEach(token => {
          const textToken = token.h || '';
          const pinyin = (token.p || '').trim();

          // Punteggiatura
          if (!pinyin && /^[，。！？、“”《》；：…,.!?;:—"'\(\) ]+$/.test(textToken)) {
            const punct = document.createElement('span');
            punct.className = 'punctuation';
            punct.textContent = textToken;
            sentenceDiv.appendChild(punct);
            return;
          }

          // Ramo Inglese
          if (detectedLang === 'en-US' || !pinyin) {
            const engSpan = document.createElement('span');
            engSpan.className = 'english-word';
            engSpan.textContent = textToken;
            engSpan.onclick = () => speakWord(textToken, 'en-US');
            sentenceDiv.appendChild(engSpan);
            return;
          }

          // Ramo Cinese con Pinyin & Toni
          const wordSpan = document.createElement('span');
          wordSpan.className = 'word-token';
          wordSpan.onclick = () => speakWord(textToken, 'zh-CN');

          const syllables = pinyin.split(/\s+/);
          const chars = Array.from(textToken);

          if (syllables.length === chars.length) {
            chars.forEach((c, i) => {
              const ruby = document.createElement('ruby');
              const toneClass = getToneClass(syllables[i]);
              ruby.innerHTML = `${c}<rt class="${toneClass}">${syllables[i]}</rt>`;
              wordSpan.appendChild(ruby);
            });
          } else {
            const ruby = document.createElement('ruby');
            const toneClass = getToneClass(pinyin);
            ruby.innerHTML = `${textToken}<rt class="${toneClass}">${pinyin}</rt>`;
            wordSpan.appendChild(ruby);
          }
          sentenceDiv.appendChild(wordSpan);
        });

        // Traduzione
        const trans = document.createElement('div');
        trans.className = 'translation';
        trans.textContent = item.m || '';

        // Controlli Audio Singolo Paragrafo
        const footer = document.createElement('div');
        footer.className = 'card-footer';

        const playBtn = document.createElement('button');
        playBtn.className = 'btn';
        playBtn.id = `play-btn-${idx}`;
        playBtn.innerHTML = '▶ Ascolta';
        playBtn.onclick = () => toggleParagraphSpeech(idx);

        footer.appendChild(playBtn);
        card.appendChild(sentenceDiv);
        card.appendChild(trans);
        card.appendChild(footer);
        container.appendChild(card);
      });
    }

    // --- Gestione Modello & Finestra Modale ---
    function handleModelPresetChange(val) {
      document.getElementById('custom-model-wrapper').style.display = (val === 'custom') ? 'block' : 'none';
    }

    function openKeyModal() {
      document.getElementById('api-key-input').value = safeStorageGet('openrouter_api_key') || '';
      const currentModel = safeStorageGet('openrouter_model') || DEFAULT_MODEL;
      const presetSelect = document.getElementById('model-preset');
      const exists = Array.from(presetSelect.options).some(opt => opt.value === currentModel);
      if (exists) {
        presetSelect.value = currentModel;
        handleModelPresetChange(currentModel);
      } else {
        presetSelect.value = 'custom';
        handleModelPresetChange('custom');
        document.getElementById('custom-model-input').value = currentModel;
      }
      document.getElementById('key-modal').classList.add('active');
    }

    function closeKeyModal() {
      document.getElementById('key-modal').classList.remove('active');
    }

    function saveSettings() {
      const key = document.getElementById('api-key-input').value.trim();
      if (key) safeStorageSet('openrouter_api_key', key);

      const preset = document.getElementById('model-preset').value;
      let finalModel = preset === 'custom' 
        ? (document.getElementById('custom-model-input').value.trim() || DEFAULT_MODEL) 
        : preset;
      safeStorageSet('openrouter_model', finalModel);
      closeKeyModal();
    }
  </script>
</body>
</html>
